          'tools/bake_character.py': r'''"""Bake the approved procedural character and automatic skeletal weights into Android assets."""
          from pathlib import Path
          import struct,numpy as np,json
          import modelar
          root=Path(__file__).resolve().parents[1]
          # 18 bones, same order and bind positions as rig.hpp. +Y up, +Z forward.
          REST=np.array([[0,0,0],[0,.91,0],[0,1.08,0],[0,1.27,0],[0,1.41,0],[0,1.52,0],[-.162,1.324,0],[-.246,1.135,.004],[-.30,.957,.025],[.162,1.324,0],[.246,1.135,.004],[.30,.957,.025],[-.079,.89,-.005],[-.10,.515,.01],[-.098,.10,-.003],[.079,.89,-.005],[.10,.515,.01],[.098,.10,-.003]],dtype=np.float32)
          PARENTS=[-1,0,1,2,3,4,3,6,7,3,9,10,1,12,13,1,15,16]
          def blend(y,lo,hi):
           t=np.clip((y-lo)/(hi-lo),0,1);return t*t*(3-2*t)
          def weights(name,pos):
           n=len(pos);w=np.zeros((n,18),np.float32);y=pos[:,1];x=np.abs(pos[:,0])
           head=name.startswith(('Rosto','Orelha','Olho','Iris','Pupila','Reflexo','Palpebra','Sobrancelha','Narina','Labio','Linha_boca','Cabelo','Mecha'))
           if head:w[:,5]=1
           elif name.startswith(('Perna','Pe_','Calcanhar','Dedo_pe')):
            side=0 if '_E' in name else 3;th,sh,ft=12+side,13+side,14+side
            if name.startswith(('Pe_','Calcanhar','Dedo_pe')):w[:,ft]=1
            else:
             knee=blend(y,.455,.575);ankle=blend(y,.075,.155);hip=blend(y,.87,.965)
             w[:,th]=knee*(1-hip);w[:,sh]=(1-knee)*ankle*(1-hip);w[:,ft]=(1-knee)*(1-ankle)*(1-hip);w[:,1]=hip
           elif name.startswith(('Braco','Ombro','Palma','Dedo_mao','Polegar')):
            side=0 if '_E' in name else 3;up,fore,hand=6+side,7+side,8+side
            if name.startswith(('Palma','Dedo_mao','Polegar')):w[:,hand]=1
            else:
             elbow=blend(y,1.085,1.19);wrist=blend(y,.95,1.00);shoulder=blend(x,.12,.185)
             w[:,up]=elbow*shoulder;w[:,fore]=(1-elbow)*wrist*shoulder;w[:,hand]=(1-elbow)*(1-wrist)*shoulder;w[:,3]=1-shoulder
           else:
            s=blend(y,.99,1.12);c=blend(y,1.15,1.29);neck=blend(y,1.365,1.415)
            w[:,1]=1-s;w[:,2]=s*(1-c);w[:,3]=s*c*(1-neck);w[:,4]=s*c*neck
           ids=np.argsort(w,axis=1)[:,-4:];v=np.take_along_axis(w,ids,axis=1);v/=v.sum(axis=1,keepdims=True)
           return ids.astype(np.float32),v
          vertices=[];indices=[];offset=0
          for m in modelar.meshes:
           p=m['v'].copy();n=m['n'].copy()
           if m['name'].startswith(('Rosto','Orelha','Olho','Iris','Pupila','Reflexo','Palpebra','Sobrancelha','Narina','Labio','Linha_boca','Cabelo','Mecha')):
            p[:,2]=1.585+(p[:,2]-1.625)*.8;n[:,2]/=.8;n/=np.maximum(np.linalg.norm(n,axis=1,keepdims=True),1e-8)
           p=p[:,[0,2,1]].copy();p[:,2]*=-1;n=n[:,[0,2,1]].copy();n[:,2]*=-1
           ids,w=weights(m['name'],p)
           vertices.append(np.concatenate([p,n,m['c'],w,ids],axis=1).astype('<f4'));indices.append(m['f']+offset);offset+=len(p)
          v=np.concatenate(vertices);ix=np.concatenate(indices).reshape(-1).astype('<u4')
          assert np.isfinite(v).all() and ix.max()<len(v)
          assert np.allclose(v[:,9:13].sum(axis=1),1) and np.all(v[:,13:17]<18)
          asset=root/'app/src/main/assets/character.skin';asset.parent.mkdir(parents=True,exist_ok=True)
          asset.write_bytes(struct.pack('<4I',0x324e4b53,len(v),len(ix),18)+v.tobytes()+ix.tobytes())
          (root/'tools/rig-info.json').write_text(json.dumps(dict(bones=18,parents=PARENTS,bind_positions=REST.tolist(),vertices=len(v),triangles=len(ix)//3),indent=2))
          print(f'SKIN2: {len(v)} vertices / {len(ix)//3} triangles / 18 bones / four normalized influences per vertex')
          ''',
          'tools/modelar.py': r'''"""Malhas reais de um estudo de personagem adulto. NumPy; Z-up, frente -Y.
          O exportador GLB converte a geometria para Y-up. Não há esqueleto nesta versão.
          """
          import numpy as np, math, json, struct
          from pathlib import Path
          P=Path(__file__).resolve().parents[1]
          meshes=[]
          skin=(.64,.405,.29); ivory=(.87,.85,.77); hair=(.43,.105,.028)

          def add(name,v,f,col,rough=.6):
           v=np.asarray(v,dtype=np.float32);f=np.asarray(f,dtype=np.uint32)
           n=np.zeros_like(v)
           normals=np.cross(v[f[:,1]]-v[f[:,0]],v[f[:,2]]-v[f[:,0]])
           for i in range(3):np.add.at(n,f[:,i],normals)
           n[np.linalg.norm(n,axis=1)<1e-8]=[0,0,1]
           n/=np.maximum(np.linalg.norm(n,axis=1,keepdims=True),1e-10)
           c=np.tile(np.asarray(col,dtype=np.float32),(len(v),1)) if np.asarray(col).ndim==1 else np.asarray(col,dtype=np.float32)
           meshes.append(dict(name=name,v=v,f=f,n=n,c=c,rough=rough))

          def gridfaces(rows,cols,wrap=True):
           f=[]
           for j in range(rows-1):
            for i in range(cols if wrap else cols-1):
             a=j*cols+i;b=j*cols+(i+1)%cols;c=(j+1)*cols+i;d=(j+1)*cols+(i+1)%cols
             f.extend([(a,b,c),(b,d,c)])
           return f

          def ellipsoid(name,center,scale,col,seg=28,rings=16,rough=.55):
           v=[]
           for j in range(rings+1):
            a=math.pi*j/rings
            for i in range(seg):
             b=2*math.pi*i/seg
             v.append(np.array(center)+np.array(scale)*[math.sin(a)*math.cos(b),math.sin(a)*math.sin(b),math.cos(a)])
           add(name,v,[(a,c,b) for a,b,c in gridfaces(rings+1,seg)],col,rough)

          def tube(name,points,radii,col,sides=10,rough=.6):
           pts=np.array(points,float);v=[]
           for j,p in enumerate(pts):
            t=pts[min(j+1,len(pts)-1)]-pts[max(0,j-1)];t/=np.linalg.norm(t)
            ref=np.array([0,1,0]) if abs(t[1])<.9 else np.array([1,0,0]);a=np.cross(t,ref);a/=np.linalg.norm(a);b=np.cross(t,a)
            r=radii[j] if hasattr(radii,'__len__') else radii
            ra,rb=r if hasattr(r,'__len__') else (r,r)
            for k in range(sides):
             ang=2*math.pi*k/sides;v.append(p+a*math.cos(ang)*ra+b*math.sin(ang)*rb)
           # Tube orientation is opposite to the sphere grid convention.
           add(name,v,gridfaces(len(pts),sides),col,rough)

          TORSO=np.array([
           [.827,.073,.068,.068],[.86,.110,.082,.090],[.91,.140,.089,.104],
           [.958,.143,.088,.103],[1.005,.124,.078,.084],[1.06,.109,.073,.075],
           [1.115,.113,.079,.077],[1.18,.127,.084,.077],[1.235,.146,.093,.078],
           [1.277,.153,.103,.076],[1.315,.159,.084,.076],[1.345,.165,.067,.071],
           [1.37,.145,.056,.061],[1.392,.068,.045,.050],[1.416,.043,.039,.042],
           [1.457,.039,.039,.041]])

          def torso_point(z,a,extra=0):
           rx,front,back=[np.interp(z,TORSO[:,0],TORSO[:,i]) for i in (1,2,3)]
           co=math.cos(a);x=(rx+extra)*math.sin(a);y=-(front+extra)*co if co>=0 else -(back+extra)*co
           # Small asymmetry-free clavicle and rib contour, avoiding mannequin cylinders.
           y-=.003*math.exp(-((z-1.335)/.014)**2)*max(co,0)*math.sin(a*3)**2
           return [x,y,z]

          def clothed(z,a):
           x=torso_point(z,a)[0]
           straps=(abs(abs(x)-.055)<.0165 and z>.923 and z<1.39)
           chest=1.232<z<1.285
           hips=.843<z<.948
           return straps or chest or hips
          v=[];colors=[]
          rows=110;cols=80
          for j,z in enumerate(np.linspace(TORSO[0,0],TORSO[-1,0],rows)):
           for i in range(cols):
            a=i*2*math.pi/cols;v.append(torso_point(z,a))
            tone=1-.04*math.cos(a*2);colors.append(np.array(skin)*tone)
          add('Corpo_torso_pescoco',v,gridfaces(rows,cols),colors,.66)
          # Precisely bounded cloth ribbons and bands, with no grid-mask stair stepping.
          def cloth_patch(name,zs,angles):
           vv=[]
           for z in zs:
            for a in angles(z):vv.append(torso_point(z,a,.0025))
           nc=len(angles(zs[0]));ff=gridfaces(len(zs),nc,False)
           if name.endswith('True'):ff=[(a,c,b) for a,b,c in ff]
           add(name,vv,ff,ivory,.87)
          for name,lo,hi in [('Roupa_peito',1.232,1.285),('Roupa_quadril',.842,.948)]:
           cloth_patch(name,np.linspace(lo,hi,28),lambda z:np.linspace(0,2*math.pi,97))
          for side in (-1,1):
           for back in (False,True):
            def angles(z):
             rx=np.interp(z,TORSO[:,0],TORSO[:,1]);xs=np.linspace(side*.055-.0165,side*.055+.0165,9)
             a=np.arcsin(np.clip(xs/(rx+.0025),-.98,.98))
             return math.pi-a if back else a
            cloth_patch('Roupa_alca_'+str(side)+str(back),np.linspace(.935,1.379,80),angles)
          # Human-shaped continuous sections for the legs, rather than stacked primitives.
          for side in (-1,1):
           suffix='E' if side<0 else 'D'
           profile=np.array([
           [.065,.098,.003,.027,.030],[.135,.099,.008,.030,.036],[.23,.100,.015,.041,.047],
           [.32,.100,.018,.052,.061],[.395,.10,.012,.046,.053],[.47,.100,-.004,.039,.043],
           [.515,.100,-.010,.042,.044],[.55,.099,-.002,.046,.049],[.65,.096,.003,.064,.066],
           [.735,.088,.003,.074,.080],[.815,.079,.005,.078,.087],[.892,.072,.010,.073,.088],[.93,.067,.007,.069,.079],[.965,.065,.003,.053,.062]])
           vv=[];cc=[];nr=85;nc=40
           for z in np.linspace(profile[0,0],profile[-1,0],nr):
            x,y,rx,ry=[np.interp(z,profile[:,0],profile[:,i]) for i in (1,2,3,4)]
            for k in range(nc):
             a=k*2*math.pi/nc;cloth=.67<z<.696 or .761<z<.787
             vv.append([side*x+(rx+(.0018 if cloth else 0))*math.sin(a),y-(ry+(.0018 if cloth else 0))*math.cos(a),z]);cc.append(ivory if cloth else skin)
           add('Perna_'+suffix,vv,gridfaces(nr,nc),cc,.68)
           # Heel, instep and discrete toes: overlapping surfaces, explicitly a modeling study.
           tube('Pe_'+suffix,[(side*.099,.05,.041),(side*.099,.025,.045),(side*.099,-.02,.045),(side*.099,-.07,.035),(side*.099,-.11,.028),(side*.099,-.141,.025)],[(.027,.027),(.041,.033),(.038,.035),(.028,.038),(.022,.039),(.017,.032)],skin,32)
           ellipsoid('Calcanhar_'+suffix,(side*.099,.026,.052),(.033,.039,.045),skin)
           for toe in range(5):
            dx=(toe-2)*.014;length=.025-toe*.0025
            ellipsoid('Dedo_pe_'+suffix+str(toe),(side*(.071+toe*.014),-.153+toe*.003,.024),( .0095-toe*.0007,length,.013),skin,16,10)
           # Clavicle, shoulder, upper arm and forearm flow along a relaxed A-pose.
           pts=[(side*.12,0,1.327),(side*.162,.001,1.324),(side*.191,.001,1.298),(side*.211,.002,1.242),(side*.233,.001,1.18),(side*.246,-.004,1.135),(side*.257,-.012,1.105),(side*.274,-.021,1.05),(side*.291,-.026,.985),(side*.3,-.025,.957)]
           rs=[(.037,.045),(.047,.047),(.045,.041),(.039,.036),(.031,.031),(.028,.029),(.032,.032),(.032,.031),(.022,.023),(.020,.021)]
           tube('Braco_'+suffix,pts,rs,skin,32)
           ellipsoid('Ombro_'+suffix,(side*.161,0,1.322),(.047,.041,.040),skin,32,20)
           # Palm narrows toward the fingers, with individual knuckles and bent fingertips.
           tube('Palma_'+suffix,[(side*.301,-.025,.969),(side*.309,-.028,.943),(side*.314,-.030,.911),(side*.315,-.031,.899)],[ (.02,.015),(.027,.015),(.029,.014),(.024,.012)],skin,24)
           for finger in range(4):
            x=side*(.291+finger*.015);base=.909-abs(finger-1)*.003;ln=[.060,.071,.067,.050][finger]
            pts=[(x,-.031,base),(x+side*.003,-.035,base-ln*.45),(x+side*.004,-.046,base-ln*.82),(x+side*.003,-.052,base-ln),(x+side*.002,-.052,base-ln-.001)]
