# AUTOSSUFICIENTE: salve somente este arquivo em .github/workflows/colosso-personagem.yml
# Todos os fontes e recursos estão embutidos abaixo. Não requer secrets.
name: Colosso — Personagem com rig
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/colosso-personagem.yml'
permissions:
  contents: read
concurrency:
  group: colosso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Compilar e disponibilizar APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Materializar projeto C++ e Android
        shell: bash
        run: |
          python3 - <<'PY_PROJECT'
          from pathlib import Path
          files = {
          '.gitignore': r'''.gradle/
          .cxx/
          **/build/
          local.properties
          *.apk
          *.keystore
          ''',
          'README.md': r'''# Colosso — Personagem com rig / versão 2

          O estudo de personagem aprovado foi integrado à arena Android C++: cabelo, rosto, corpo e roupa são a mesma geometria procedural, agora com rig de 18 ossos, pesos e animação esquelética na GPU. A espada acompanha a mão animada. Mantém a luta completa contra o colosso.

          ## Usar somente o YAML

          1. Salve o arquivo entregue em `.github/workflows/colosso-personagem.yml` no seu repositório GitHub.
          2. Faça commit. O workflow **Colosso — Personagem com rig** inicia no push; também pode ser iniciado por **Actions → Run workflow** na branch principal.
          3. Abra a execução e baixe **Artifacts → Colosso-Personagem-Rig-APK**. Extraia o ZIP e instale `Colosso-Personagem-Rig.apk`.

          Não é necessário enviar o GLB, editar fontes, instalar Blender ou adicionar modelos/animações. O YAML contém os fontes Android, C++, geradores e testes. Durante a compilação, um script gera a malha e os pesos automaticamente. O runner precisa de internet para instalar as ferramentas, mas o jogo instalado funciona offline.

          O APK é assinado automaticamente com a chave de debug do runner. Ao atualizar uma build anterior, o Android pode exigir desinstalar a versão antiga porque a chave pode ter mudado. Não é uma assinatura de distribuição para a Play Store. Requer Android 8.0+, GPU OpenGL ES 3 e tela horizontal. Inclui ARM64, ARMv7 e x86_64.

          ## Rig e animação

          Hierarquia com 18 ossos: raiz, quadril, coluna, peito, pescoço, cabeça, braços, antebraços, mãos, coxas, canelas e pés. Cada vértice dispõe de até quatro influências normalizadas. As matrizes hierárquicas e as matrizes inversas da pose de repouso deformam a malha na GPU, tanto na cena quanto na passagem de sombras.

          Estados implementados: repouso/respiração, corrida, salto, queda, aterrissagem, escalada, esquiva, ataque, vitória e derrota. Transições interpolam as rotações ao longo do tempo. São animações esqueléticas procedurais; não são captura de movimento nem clips produzidos manualmente em Blender. Dedos e cabelo acompanham mãos/cabeça, sem ossos individuais ou simulação secundária.

          A malha mantém aproximadamente 110 mil triângulos. A câmera foi aproximada. Não há garantia de 60 FPS: desempenho e compatibilidade precisam ser medidos em celulares reais. Partes da malha original se sobrepõem, e algumas junções podem mostrar artefatos em poses extremas. Ainda é um protótipo, não uma produção AAA.

          ## Física e combate

          Gravidade, velocidade, salto, atrito de movimento, colisões com chão, colunas, pernas do gigante e limites da arena. Há dano de queda, ondas de impacto, vida e estamina. A esquiva oferece invulnerabilidade breve e custa estamina. A escalada prende o controlador a uma rota sobre o corpo do gigante; não é simulação física livre de agarramento. Não há ragdoll ou motor de corpos rígidos externo.

          ## Controles

          | Entrada | Ação |
          |---|---|
          | Joystick esquerdo | Mover; durante a escalada, subir/descer |
          | Arrastar região direita livre | Girar/inclinar a câmera |
          | ATACAR | Golpear o selo ativo próximo; um toque por golpe |
          | PULAR | Saltar; ao escalar, saltar para trás e soltar |
          | AGARRAR/SOLTAR | Iniciar escalada perto da base ou soltar |
          | ESQUIVAR | Avançar rapidamente com invulnerabilidade breve |
          | PAUSA / Voltar | Pausar/retomar |

          Quebre o selo da perna com três golpes, agarre o gigante, suba ao peito e acerte três golpes. Continue até a cabeça e acerte quatro. Os apoios em 8,5 m e 15,6 m recuperam estamina quando você para. Pare o joystick no aviso de sacudida. Salte ou esquive da onda laranja dos pisões.

          ## Build e validação

          O workflow instala Python 3.12/NumPy 1.26.4 para gerar a malha, JDK 17, Gradle 8.9, AGP 8.7.3, SDK 35, NDK 27.2.12479018 e CMake 3.22.1. Não é necessário acesso à Epic ou a assets externos.

          A build executa os testes de física/combate e de rig/animação antes de compilar as três arquiteturas. Verifica a assinatura, o alinhamento do APK e a presença das bibliotecas nativas e do asset de personagem. Um segundo job instala o APK no emulador e verifica a abertura, salvando log e captura.

          Nesta entrega, os testes C++ e a renderização OpenGL ES foram executados localmente. A compilação Android, a Activity Java e o workflow desta versão ainda não foram executados aqui. Leia `VALIDACAO.md` para os limites dos testes.

          ## Desenvolvimento a partir dos fontes

          Execute `python3 -m pip install numpy==1.26.4`, depois `python3 tools/bake_character.py` e então `gradle :app:assembleDebug` com o SDK/NDK instalados. O asset `app/src/main/assets/character.skin` é gerado, não precisa ser criado manualmente.

          O YAML é um snapshot dos fontes. Alterar um fonte extraído não muda automaticamente o conteúdo embutido no YAML. O formato binário nativo não é GLB; o rig é definido em `rig.hpp` e os pesos são gerados em `tools/bake_character.py`.
          ''',
          'VALIDACAO.md': r'''# Validação da versão 2

          Executado localmente nesta sessão:

          - Geração da malha aprovada: 59.550 vértices, 109.928 triângulos, rig de 18 ossos e quatro slots de influência por vértice. Índices dentro dos limites, dados finitos e pesos normalizados.
          - GCC/C++17 com `-Wall -Wextra -Werror` e UndefinedBehaviorSanitizer: testes da física, combate e rig passaram.
          - Rig: pose de repouso produz matrizes identidade; hierarquia mantém o comprimento entre juntas; dez estados de animação exercitados; pausa preserva a pose; simulação integrada mantém matrizes finitas.
          - Física: salto, aterrissagem, colisão com coluna, limites da arena, escalada, recuperação/esgotamento de estamina, ondas de impacto, esquiva, derrota e reinício.
          - Luta automatizada, usando entradas normais desde o spawn, alcançou vitória com os dez golpes. Esse controlador conhece a posição dos selos e não representa uma partida humana.
          - Renderização real com EGL/OpenGL ES 3.2 Mesa llvmpipe: shaders de skinning e sombras compilaram; malha e espada foram desenhadas na arena, em corrida, ataque e escalada, sem erros OpenGL. Capturas inspecionadas.
          - YAML analisado e sintaxe dos comandos verificada; fontes embutidos reconstruídos e comparados ao projeto. O gerador de malha não requer Blender nem download de modelos.

          Ainda não executado nesta sessão:

          - Compilação com SDK/NDK e Gradle, compilação Java Android e workflow em uma conta GitHub.
          - Instalação deste APK em emulador ou aparelho físico, multitouch, áudio e ciclo de vida Android desta versão.
          - Medições de FPS, consumo de memória e aquecimento em dispositivos físicos.

          O harness gráfico usa declarações locais de ligação para JNI e um contexto OpenGL real. Ele verifica o renderizador C++, mas não substitui a compilação Android. O smoke test incluído no YAML verificará abertura/renderização no emulador quando o workflow for executado; não testa a luta completa pela interface touch.
          ''',
          'app/build.gradle': r'''plugins { id 'com.android.application' }
          android {
              namespace 'com.aurora.colosso'
              compileSdk 35
              buildToolsVersion '35.0.0'
              ndkVersion '27.2.12479018'
              defaultConfig {
                  applicationId 'com.aurora.colosso'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '2.0-rig'
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
                  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'; cppFlags '-std=c++17 -O2 -Wall -Wextra' } }
              }
              externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
              buildTypes { debug { debuggable true }; release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }

          tasks.named("preBuild").configure { doFirst { if (!file("src/main/assets/character.skin").exists()) throw new GradleException("Run python3 tools/bake_character.py from project root before building") } }
          ''',
          'app/src/main/AndroidManifest.xml': r'''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00030000" android:required="true" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:theme="@style/GameTheme" android:label="Colosso: Cinzas" android:icon="@drawable/icon" android:allowBackup="false" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:screenOrientation="sensorLandscape" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          ''',
          'app/src/main/cpp/CMakeLists.txt': r'''cmake_minimum_required(VERSION 3.22.1)
          project(colosso LANGUAGES CXX)
          add_library(colosso SHARED renderer.cpp)
          target_compile_features(colosso PRIVATE cxx_std_17)
          target_link_libraries(colosso GLESv3 android log)
          ''',
          'app/src/main/cpp/game.hpp': r'''#pragma once
          #include <algorithm>
          #include <cmath>
          #include <vector>
          #include <cstdint>

          namespace cc {
          constexpr float PI=3.14159265359f;
          inline float clamp(float v,float a,float b){return std::max(a,std::min(b,v));}
          struct V { float x=0,y=0,z=0; V operator+(V b)const{return{x+b.x,y+b.y,z+b.z};} V operator-(V b)const{return{x-b.x,y-b.y,z-b.z};} V operator*(float s)const{return{x*s,y*s,z*s};} };
          inline float dot(V a,V b){return a.x*b.x+a.y*b.y+a.z*b.z;}
          inline V cross(V a,V b){return{a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x};}
          inline float length(V a){return std::sqrt(dot(a,a));}
          inline V norm(V a){return a*(1/std::max(.00001f,length(a)));}
          inline float distanceXZ(V a,V b){return length({a.x-b.x,0,a.z-b.z});}
          struct Obstacle { V p; float r,h; };
          struct Particle { V p,v; float life,maxLife,size; int kind; };
          struct Input {float x=0,y=0,lookX=0,lookY=0; unsigned buttons=0;};
          enum Button:unsigned {Jump=1,Attack=2,Grab=4,Dodge=8,Start=16,Pause=32,Reset=64};
          enum Event:unsigned {Hit=1,Hurt=2,Stomp=4,Win=8,Leap=16};
          enum Mode {Title,Playing,Paused,Victory,Defeat};

          struct Game {
              V player{0,0,19},velocity{},boss{0,0,-3},shockCenter{};
              float yaw=0,pitch=-.16f,facing=PI,hp=100,stamina=100,t=0,elapsed=0;
              float attackCD=0,attackAnim=0,invulnerable=0,dodgeTime=0;
              float bossClock=0,shock=-1,shakeClock=0,victoryTime=0,flash=0;
              bool climbing=false,shockHit=false; int phase=0,hits=0,totalHits=0;
              Mode mode=Title; unsigned events=0; uint32_t seed=2471;
              std::vector<Obstacle> obstacles;
              std::vector<Particle> particles;
              Game(){for(int i=0;i<18;i++){float a=i*2*PI/18;obstacles.push_back({{std::sin(a)*31,0,std::cos(a)*31},1.4f,9+float(i%4)*2});}}
              float random(){seed=1664525*seed+1013904223;return float(seed>>8)/16777216.f;}
              V weak()const{return boss+V{phase==0?-2.5f:0,phase==0?2.3f:(phase==1?12.3f:20.2f),phase==0?2.0f:(phase==1?3.1f:1.8f)};}
              int needed()const{return phase==2?4:3;}
              float bossHealth()const{return clamp(1-totalHits/10.f,0,1);}
              float climbZ()const{return player.y<8?2.05f:(player.y<16?3.15f:1.9f);}
              bool resting()const{return (std::abs(player.y-8.5f)<.6f||std::abs(player.y-15.6f)<.6f);}
              void burst(V p,int count,int kind){for(int i=0;i<count&&particles.size()<400;i++){float l=.5f+random()*1.1f;particles.push_back({p,{(random()-.5f)*8,2+random()*8,(random()-.5f)*8},l,l,.07f+random()*.19f,kind});}}
              void hurt(float damage){if(invulnerable>0||mode!=Playing)return;hp=std::max(0.f,hp-damage);flash=.6f;invulnerable=1.1f;events|=Hurt;if(hp<=0){mode=Defeat;climbing=false;}}
              void detach(){climbing=false;velocity={0,4,5};player.z+=1;invulnerable=.7f;}
              void step(float dt,Input in={}){
                  if(in.buttons&Reset){*this=Game();mode=Playing;return;}
                  if(in.buttons&Start){if(mode==Title)mode=Playing;else if(mode==Paused)mode=Playing;}
                  if(in.buttons&Pause){if(mode==Playing)mode=Paused;else if(mode==Paused)mode=Playing;}
                  if(mode==Title){t+=dt;return;}
                  if(mode==Paused||mode==Defeat)return;
                  t+=dt;
                  for(auto &p:particles){p.life-=dt;p.v.y-=12*dt;p.p=p.p+p.v*dt;if(p.p.y<.06f){p.p.y=.06f;p.v.y*= -.3f;}}
                  particles.erase(std::remove_if(particles.begin(),particles.end(),[](const Particle&p){return p.life<=0;}),particles.end());
                  if(mode==Victory){velocity.y-=23*dt;player=player+velocity*dt;if(player.y<0){player.y=0;velocity={};}victoryTime+=dt;if(victoryTime<3&&random()<.35f)burst(boss+V{(random()-.5f)*10,random()*20,0},5,0);return;}
                  elapsed+=dt;flash=std::max(0.f,flash-dt);attackCD=std::max(0.f,attackCD-dt);attackAnim=std::max(0.f,attackAnim-dt);
                  invulnerable=std::max(0.f,invulnerable-dt);dodgeTime=std::max(0.f,dodgeTime-dt);
                  yaw-=in.lookX;pitch=clamp(pitch+in.lookY,-.65f,1.10f);
                  float mag=std::sqrt(in.x*in.x+in.y*in.y);if(mag>1){in.x/=mag;in.y/=mag;}
                  V forward{-std::sin(yaw),0,-std::cos(yaw)},right{std::cos(yaw),0,-std::sin(yaw)};
                  V movement=right*in.x+forward*in.y;
                  if(in.buttons&Grab){
                      if(climbing)detach();
                      else if(distanceXZ(player,boss)<6.7f&&player.y<5&&stamina>15){climbing=true;player.y=std::max(1.f,player.y);velocity={};}
                  }
                  if(climbing){
                      float speed=2.6f;
                      player.y=clamp(player.y+in.y*speed*dt,1.f,20.2f);
                      player.x=boss.x+(player.y<8?-2.5f*(1-clamp((player.y-6)/2,0,1)):0);
                      player.z=boss.z+climbZ()+.5f;
                      facing=PI;
                      stamina=clamp(stamina+((resting()&&std::abs(in.y)<.15f)?25.f:-(std::abs(in.y)>.1f?3.8f:1.2f))*dt,0,100);
                      shakeClock+=dt;
                      if(shakeClock>=7.5f){shakeClock=0;if(std::abs(in.y)>.2f){stamina=std::max(0.f,stamina-28);burst(player,12,0);events|=Stomp;}}
                      if((in.buttons&Jump)||stamina<=0)detach();
                  }else{
                      shakeClock=0;
                      bool grounded=player.y<=.001f;
                      if((in.buttons&Dodge)&&stamina>=18&&grounded&&dodgeTime<=0){stamina-=18;dodgeTime=.36f;invulnerable=.46f;if(length(movement)<.1f)movement={std::sin(facing),0,std::cos(facing)};velocity.x=movement.x*15;velocity.z=movement.z*15;}
                      if(dodgeTime<=0){float k=std::min(1.f,dt*(grounded?13:4));velocity.x+=(movement.x*6.8f-velocity.x)*k;velocity.z+=(movement.z*6.8f-velocity.z)*k;}
                      if(length(movement)>.1f)facing=std::atan2(movement.x,movement.z);
                      if((in.buttons&Jump)&&grounded){velocity.y=9.1f;events|=Leap;}
                      velocity.y-=23*dt;player=player+velocity*dt;
                      if(player.y<0){if(velocity.y<-18)hurt((-velocity.y-18)*2.0f);player.y=0;velocity.y=0;}
                      float edge=distanceXZ(player,{});if(edge>38){player.x*=38/edge;player.z*=38/edge;}
                      for(const auto&o:obstacles){float d=distanceXZ(player,o.p),r=o.r+.4f;if(d<r&&player.y<o.h){V n=norm(V{player.x-o.p.x,0,player.z-o.p.z});if(d<.001f)n={1,0,0};player=player+n*(r-d);}}
                      // Two stone legs are separate collision cylinders, leaving a passage between them.
                      for(float side:{-1.f,1.f}){V c=boss+V{side*2.5f,0,0};float d=distanceXZ(player,c);if(d<1.95f&&player.y<8){V n=norm(V{player.x-c.x,0,player.z-c.z});if(d<.001f)n={0,0,1};player=player+n*(1.95f-d);}}
                      stamina=clamp(stamina+15*dt,0,100);
                  }
                  if((in.buttons&Attack)&&attackCD<=0&&stamina>=7){
                      attackCD=.55f;attackAnim=.42f;stamina-=7;
                      V hand=player+V{0,1.1f,0};
                      if(length(hand-weak())<2.45f){
                          hits++;totalHits++;events|=Hit;burst(weak(),35,1);
                          if(hits>=needed()){phase++;hits=0;stamina=100;hp=std::min(100.f,hp+18);burst(weak(),35,1);if(phase>=3){phase=2;mode=Victory;events|=Win;climbing=false;}}
                      }
                  }
                  if(mode!=Playing)return;
                  float dist=distanceXZ(player,boss);
                  if(!climbing&&dist>11&&bossClock<3.8f){V d=norm(V{player.x-boss.x,0,player.z-boss.z});V next=boss+d*(dt*.65f);if(distanceXZ(next,{})<17)boss=next;}
                  bossClock+=dt;
                  float period=phase==2?5.0f:6.2f;
                  if(bossClock>=period){bossClock=0;shock=0;shockHit=false;shockCenter=boss;events|=Stomp;burst(boss+V{2.5f,0,2},45,0);}
                  if(shock>=0){shock+=dt*13;float d=distanceXZ(player,shockCenter);if(!shockHit&&std::abs(d-shock)<1.3f&&!climbing&&player.y<1.2f){hurt(24);shockHit=true;}if(shock>40)shock=-1;}
                  if(climbing&&phase==0&&player.y>5){/* Lower seal can still be reached by descending. */}
              }
          };
          }
          ''',
          'app/src/main/cpp/renderer.cpp': r'''#include "game.hpp"
          #include "rig.hpp"
          #include <cstring>
          #include <array>
          #include <string>
          #include <stdexcept>
          #ifndef SCENE_EXPORT
          #include <jni.h>
          #include <GLES3/gl3.h>
          #include <android/log.h>
          #endif
          using namespace cc;
          struct Mat{float a[16]{};};
          Mat identity(){Mat m;for(int i=0;i<4;i++)m.a[i*5]=1;return m;}
          Mat mul(Mat a,Mat b){Mat c;for(int i=0;i<4;i++)for(int j=0;j<4;j++)for(int k=0;k<4;k++)c.a[i*4+j]+=a.a[k*4+j]*b.a[i*4+k];return c;}
          Mat transform(V p,V s,float yaw=0,float roll=0){
              Mat t=identity(),y=identity(),z=identity(),scale=identity();
              t.a[12]=p.x;t.a[13]=p.y;t.a[14]=p.z;
              y.a[0]=y.a[10]=std::cos(yaw);y.a[2]=-std::sin(yaw);y.a[8]=std::sin(yaw);
              z.a[0]=z.a[5]=std::cos(roll);z.a[1]=std::sin(roll);z.a[4]=-std::sin(roll);
              scale.a[0]=s.x;scale.a[5]=s.y;scale.a[10]=s.z;return mul(t,mul(y,mul(z,scale)));
          }
          Mat lookAt(V eye,V target){V f=norm(target-eye),s=norm(cross(f,{0,1,0})),u=cross(s,f);Mat m=identity();m.a[0]=s.x;m.a[4]=s.y;m.a[8]=s.z;m.a[1]=u.x;m.a[5]=u.y;m.a[9]=u.z;m.a[2]=-f.x;m.a[6]=-f.y;m.a[10]=-f.z;m.a[12]=-dot(s,eye);m.a[13]=-dot(u,eye);m.a[14]=dot(f,eye);return m;}
          Mat perspective(float aspect){Mat m;float f=1/std::tan(.95f/2);m.a[0]=f/aspect;m.a[5]=f;m.a[10]=-(180.f+.15f)/(180.f-.15f);m.a[11]=-1;m.a[14]=-2*180*.15f/(180-.15f);return m;}
          Mat ortho(float r){Mat m=identity();m.a[0]=m.a[5]=1/r;m.a[10]=-2.f/160;m.a[14]=-1;return m;}
          struct Instance{Mat model;float color[4];};
          Game game;
          Rig heroRig;
          std::vector<Instance> world,objects;
          V stone{.38f,.40f,.34f},trim{.56f,.54f,.43f},moss{.25f,.33f,.23f},cyan{.25f,1,.88f};
          void box(std::vector<Instance>&out,V p,V s,V c,float yaw=0,float roll=0,float glow=0){out.push_back({transform(p,s,yaw,roll),{c.x,c.y,c.z,glow}});}
          void tower(std::vector<Instance>&out,V p,float radius,float height,int segments=10){
              for(int level=0;level<int(height/.65f);level++){
                  float y=.325f+level*.65f,rr=radius*(1-.12f*y/height);
                  for(int i=0;i<segments;i++){float a=(i+(level%2)*.5f)*2*PI/segments;float shade=.87f+.13f*std::sin(i*47.f+level*12.f);box(out,p+V{std::sin(a)*rr,y,std::cos(a)*rr},{rr*.64f,.60f,.58f},stone*shade,a);}
              }
              box(out,p+V{0,height,0},{radius*2.45f,.48f,radius*2.45f},trim);
          }
          void makeWorld(){
              world.clear();box(world,{0,-.5f,0},{100,1,100},{.29f,.31f,.25f});
              for(int i=0;i<18;i++){
                  const auto&o=game.obstacles[i];tower(world,o.p,1.1f,o.h,8);
