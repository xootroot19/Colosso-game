      - name: Python para gerar a personagem e os pesos
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar malha e skinning automaticamente
        working-directory: game
        shell: bash
        run: |
          python3 -m pip install numpy==1.26.4
          python3 tools/bake_character.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar versões fixadas
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Testar movimento, física e vitória completa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined game/tests/game_test.cpp -o game-tests
          ./game-tests | tee output/TESTES.txt
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=undefined game/tests/rig_test.cpp -o rig-tests
          ./rig-tests | tee -a output/TESTES.txt
      - name: Compilar APK universal assinado para instalação
        working-directory: game
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar e empacotar
        shell: bash
        run: |
          set -euo pipefail
          cp game/app/build/outputs/apk/debug/app-debug.apk output/Colosso-Personagem-Rig.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/Colosso-Personagem-Rig.apk | tee output/ASSINATURA.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 output/Colosso-Personagem-Rig.apk > output/ALINHAMENTO.txt
          python3 - <<'PY_VERIFY'
          import zipfile
          p='output/Colosso-Personagem-Rig.apk'
          with zipfile.ZipFile(p) as z:
              assert 'assets/character.skin' in z.namelist()
              for abi in ('arm64-v8a','armeabi-v7a','x86_64'):
                  assert f'lib/{abi}/libcolosso.so' in z.namelist(), abi
          print('APK contém as três arquiteturas nativas e o asset de personagem.')
          PY_VERIFY
          (cd output && sha256sum Colosso-Personagem-Rig.apk > SHA256.txt)
          cp game/README.md output/LEIA-ME.md
          echo 'APK compilado por esta execução do GitHub Actions. Consulte o job smoke para a verificação de abertura.' > output/STATUS-CI.txt
          {
            echo '### APK disponível'
            echo 'Baixe **Colosso-Personagem-Rig-APK** em Artifacts e extraia **Colosso-Personagem-Rig.apk**.'
            echo 'Android 8.0+ / OpenGL ES 3 / ARM64, ARMv7 e x86_64. Assinatura de debug automática.'
            echo 'O job smoke verifica a abertura em emulador separadamente.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Colosso-Personagem-Rig-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
  smoke:
    name: Instalar e abrir no emulador
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Colosso-Personagem-Rig-APK
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar e verificar primeiro frame
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p smoke
            adb install -r apk/Colosso-Personagem-Rig.apk
            adb logcat -c
            adb shell am start -W -n com.aurora.colosso/.MainActivity --ez autostart true
            sleep 12
            adb logcat -d > smoke/logcat.txt
            adb shell pidof com.aurora.colosso
            grep 'RENDER_OK mode=1' smoke/logcat.txt
            if grep -q 'FATAL EXCEPTION' smoke/logcat.txt; then exit 1; fi
            adb exec-out screencap -p > smoke/arena.png
      - name: Disponibilizar captura e log do emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Colosso-Personagem-Rig-Emulador
          path: smoke/
          if-no-files-found: warn
          retention-days: 14
